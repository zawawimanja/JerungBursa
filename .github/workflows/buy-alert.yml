name: Market Close BUY Alert 5:15 PM

# Kirim senarai "saham patut beli" (Fresh Rider + Hot Theme) ke Telegram
# setiap hari dagangan ~5:15 petang MYT (selepas market tutup 5:00 petang).
#
# Nota: GitHub Actions cron (09:15 UTC = 5:15 PM MYT).
# Trigger utama dijana melalui Vercel cron (webhook dispatch) atau GitHub schedule fallback.

on:
  schedule:
    - cron: '15 9 * * 1-5'   # 09:15 UTC = 5:15 PM Malaysia, Isnin-Jumaat (fallback)
  workflow_dispatch:         # Butang 'Run workflow' di GitHub utk uji manual
  repository_dispatch:       # Webhook trigger (Vercel / cron-job.org)
    types: [buy_alert_trigger]

concurrency:
  group: buy-alert-group
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Buy Alert (harga penutupan + list FR/HT + Telegram)
        run: node scripts/buy_alert.js
        working-directory: smart-money-tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
